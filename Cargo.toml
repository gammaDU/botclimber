[package]
name = "botclimber"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "botclimber"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "migrations/migrate.rs"

[[bin]]
name = "example-bot"
path = "src/bin/example_bot.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

# WebSocket
tokio-tungstenite = "0.26"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

# Configuration
config = "0.14"

# Rate limiting
governor = "0.8"
futures-util = "0.3"
dashmap = "6"

# HTTP client (used by example-bot binary)
reqwest = { version = "0.12", features = ["json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
