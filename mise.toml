[tools]
node = "25"

[tasks.frontend-install]
description = "Install frontend npm dependencies"
dir = "frontend"
run = "npm install --legacy-peer-deps"

[tasks.frontend-build]
description = "Build the Angular frontend (outputs to frontend/dist/)"
dir = "frontend"
run = "npm run build"
depends = ["frontend-install"]

[tasks.migrate]
description = "Run database migrations"
run = "cargo run --bin migrate -- .data/botclimber.db"

[tasks.server]
description = "Start the backend server"
run = "cargo run --bin botclimber -- server_config.toml"
depends = ["frontend-build"]

[tasks.test]
description= "Run the tests in the backend"
run = "cargo test --bin botclimber"

[tasks.clippy]
description = "Run Clippy linter"
run = "cargo clippy -- -D warnings"

[tasks.example-bot]
description = "Run the example bot (jumps every 5 seconds)"
run = "cargo run --bin example-bot"

[tasks.frontend-dev]
description = "Start the Angular dev server with API proxy (http://localhost:4200)"
dir = "frontend"
run = "npm start"
depends = ["frontend-install"]

[tasks.docs-build]
description = "Compile OpenAPI definitions to a static HTML file"
run = "npx @redocly/cli build-docs docs/openapi.yaml -o frontend/src/assets/api-docs.html"

[tasks.release]
description = "Create a release zip file with docker-compose and container"
depends = ["frontend-build"]
run = 'powershell -ExecutionPolicy Bypass -File scripts/release.ps1'
