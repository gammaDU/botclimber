[server]
bind = "0.0.0.0:8443"
frontend_dist_path = "frontend/dist"
tls_cert_path = "cert.pem"
tls_key_path = "key.pem"

[database]
path = ".data/botclimber.db"

[auth]
# Must be at least 32 characters. Set via env: BOTCLIMBER__AUTH__JWT_SECRET
jwt_secret = "change-me-to-a-secret-of-at-least-32-chars"
jwt_expiry_secs = 3600

[rate_limiting]
ip_requests_per_second = 100
ip_burst_size = 200
bot_requests_per_second = 10
bot_burst_size = 20
user_requests_per_second = 30
user_burst_size = 60

[game]
default_game_mode = "Hardcore"
default_session_type = "Timetrial"
default_stage_type = "Fixed"
default_stage_id = "tutorial"
player_timeout_secs = 60
max_players = 50
tick_rate_hz = 60.0
maps_path = "maps"
